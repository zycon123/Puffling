name: Build Orbuff Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - 'launch/**'
    paths:
      - 'package.json'
      - 'release.config.json'
      - 'capacitor.config.ts'
      - 'assets/**'
      - 'scripts/prepare-mobile-web.mjs'
      - 'scripts/validate-mobile-release.mjs'
      - 'scripts/configure-native-release.mjs'
      - 'scripts/apply-native-assets.mjs'
      - 'scripts/validate-android-store-target.mjs'
      - 'index.html'
      - 'style.css'
      - 'game.js'
      - 'audio_theme.js'
      - 'js/**'
      - '.github/workflows/build-android-release.yml'
  pull_request:
    paths:
      - 'package.json'
      - 'release.config.json'
      - 'capacitor.config.ts'
      - 'assets/**'
      - 'scripts/prepare-mobile-web.mjs'
      - 'scripts/validate-mobile-release.mjs'
      - 'scripts/configure-native-release.mjs'
      - 'scripts/apply-native-assets.mjs'
      - 'scripts/validate-android-store-target.mjs'
      - 'index.html'
      - 'style.css'
      - 'game.js'
      - 'audio_theme.js'
      - 'js/**'
      - '.github/workflows/build-android-release.yml'

permissions:
  contents: read

env:
  ORBUFF_ANDROID_KEYSTORE_BASE64: ${{ secrets.ORBUFF_ANDROID_KEYSTORE_BASE64 }}
  ORBUFF_ANDROID_KEY_ALIAS: ${{ secrets.ORBUFF_ANDROID_KEY_ALIAS }}
  ORBUFF_ANDROID_STORE_PASSWORD: ${{ secrets.ORBUFF_ANDROID_STORE_PASSWORD }}
  ORBUFF_ANDROID_KEY_PASSWORD: ${{ secrets.ORBUFF_ANDROID_KEY_PASSWORD }}

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate mobile web bundle
        run: npm run mobile:validate

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Android project
        run: npx cap sync android

      - name: Apply Orbuff native assets
        run: npm run mobile:assets:android:optional

      - name: Validate Google Play API 36 target
        run: node scripts/validate-android-store-target.mjs

      - name: Apply native release version
        run: npm run mobile:configure:android

      - name: Validate production signing secret set
        shell: bash
        run: |
          set -euo pipefail
          count=0
          [ -n "${ORBUFF_ANDROID_KEYSTORE_BASE64:-}" ] && count=$((count+1))
          [ -n "${ORBUFF_ANDROID_KEY_ALIAS:-}" ] && count=$((count+1))
          [ -n "${ORBUFF_ANDROID_STORE_PASSWORD:-}" ] && count=$((count+1))
          [ -n "${ORBUFF_ANDROID_KEY_PASSWORD:-}" ] && count=$((count+1))
          if [ "$count" -ne 0 ] && [ "$count" -ne 4 ]; then
            echo "Android production signing is partially configured. Set all four ORBUFF_ANDROID_* signing secrets or none of them."
            exit 1
          fi
          if [ "$count" -eq 4 ]; then
            for asset in logo.svg logo-dark.svg; do
              if [ ! -f "assets/$asset" ]; then
                echo "Production signing requires approved Orbuff SVG masters. Missing assets/$asset"
                exit 1
              fi
            done
            echo "Android production signing secrets and approved Orbuff SVG masters are fully configured."
          else
            echo "Android production signing secrets are not configured; signed AAB generation will remain disabled."
          fi

      - name: Build unsigned release AAB and debug APK
        working-directory: android
        run: ./gradlew bundleRelease assembleDebug

      - name: Create signed Play upload AAB
        if: ${{ env.ORBUFF_ANDROID_KEYSTORE_BASE64 != '' && env.ORBUFF_ANDROID_KEY_ALIAS != '' && env.ORBUFF_ANDROID_STORE_PASSWORD != '' && env.ORBUFF_ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          keystore="$RUNNER_TEMP/orbuff-upload.jks"
          signed="$RUNNER_TEMP/orbuff-5.27.107-107-signed.aab"
          printf '%s' "$ORBUFF_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          unsigned="$(find android/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          test -n "$unsigned"
          cp "$unsigned" "$signed"
          jarsigner \
            -sigalg SHA256withRSA \
            -digestalg SHA-256 \
            -keystore "$keystore" \
            -storepass "$ORBUFF_ANDROID_STORE_PASSWORD" \
            -keypass "$ORBUFF_ANDROID_KEY_PASSWORD" \
            "$signed" \
            "$ORBUFF_ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs "$signed"
          rm -f "$keystore"

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: orbuff-android-unsigned-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload signed Play AAB
        if: ${{ env.ORBUFF_ANDROID_KEYSTORE_BASE64 != '' && env.ORBUFF_ANDROID_KEY_ALIAS != '' && env.ORBUFF_ANDROID_STORE_PASSWORD != '' && env.ORBUFF_ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: orbuff-android-play-signed-aab
          path: ${{ runner.temp }}/orbuff-5.27.107-107-signed.aab
          if-no-files-found: error

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: orbuff-android-device-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
