name: Build Orbuff Windows PC

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'game.js'
      - 'js/desktop_controls.js'
      - 'electron-builder.yml'
      - 'package.json'
      - 'scripts/validate-desktop-release.mjs'
      - '.github/workflows/build-steam-windows.yml'

jobs:
  validate-desktop:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate PC wrapper
        run: npm run desktop:validate

  build-windows:
    needs: validate-desktop
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build NSIS and portable Windows packages
        run: npm run desktop:dist:win
      - name: Upload Windows build
        uses: actions/upload-artifact@v6
        with:
          name: Orbuff-Windows
          path: dist/desktop/*
          if-no-files-found: error
