name: Validate Orbuff Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate modular browser build
        run: node scripts/validate-build.mjs
      - name: Validate PC control behavior
        run: node scripts/validate-pc-controls.mjs
      - name: Validate runtime models
        run: node scripts/validate-runtime-models.mjs
      - name: Validate Orbuff player-facing branding
        run: node scripts/validate-orbuff-branding.mjs
      - name: Validate Orbuff energy and revival
        run: node scripts/validate-orbuff-energy.mjs
      - name: Validate OrbVault rest and upgrades
        run: node scripts/validate-orbvault.mjs
      - name: Validate all 8 OrbVault protection slots
        run: node scripts/validate-orbvault-protection.mjs
      - name: Validate starter onboarding and first-run rewards
        run: node scripts/validate-onboarding.mjs
      - name: Simulate full launch gameplay journey
        run: node scripts/validate-launch-simulation.mjs
      - name: Validate reward economy
        run: node scripts/validate-reward-economy.mjs
      - name: Soak-test all bosses and 300000m endless run
        run: node scripts/validate-full-game-endurance.mjs
      - name: Validate all-boss reward session sync
        run: node scripts/validate-boss-session-sync.mjs
      - name: Validate Race HUD and desktop playfield
        run: node scripts/validate-race-hud.mjs
      - name: Validate deterministic Race course
        run: node scripts/validate-race-course-seed.mjs
      - name: Validate Ranked Quick Race
        run: node scripts/validate-race-ranking.mjs
      - name: Validate selected usable Orbuff in Race
        run: node scripts/validate-race-active-orbuff.mjs
      - name: Validate Mystery Box vault
        run: node scripts/validate-mystery-box-vault.mjs
      - name: Validate Diamond wallet client
        run: node scripts/validate-diamond-wallet.mjs
      - name: Validate Diamond IAP scaffold
        run: node scripts/validate-diamond-iap.mjs
      - name: Validate native StoreKit / Google Play bridge
        run: node scripts/validate-native-iap-bridge.mjs
      - name: Validate Orbuff duplicates and trading
        run: node scripts/validate-trading.mjs
      - name: Validate 100 Orbuffs and unique traits
        run: node scripts/validate-100-pufflings.mjs
      - name: Validate 97 evolvable Orbuffs
        run: node scripts/validate-evolution.mjs
      - name: Validate localized starter evolution copy
        run: node scripts/validate-evolution-localization.mjs
      - name: Validate store compliance gates
        run: node scripts/validate-store-compliance.mjs
      - name: Validate store submission forms and signing docs
        run: node scripts/validate-store-submission-docs.mjs
      - name: Validate native icon and splash asset pipeline
        run: node scripts/validate-native-assets-pipeline.mjs
      - name: Validate generated store graphics
        run: node scripts/validate-store-assets.mjs
      - name: Validate launch readiness
        run: node scripts/validate-launch-readiness.mjs
