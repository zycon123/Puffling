name: Validate Orbuff Mobile Release

on:
  push:
    branches:
      - main
      - 'launch/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate-mobile-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install mobile tooling
        run: npm install --no-audit --no-fund

      - name: Validate prepared native web bundle
        run: npm run mobile:validate
