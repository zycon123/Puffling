name: Validate Race Server

on:
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/validate-race-server.yml'
  push:
    branches: [main]
    paths:
      - 'server/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm install
      - run: npm run check
