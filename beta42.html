<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Puffling Beta</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#58c4ff}</style></head><body><script>(async()=>{try{const nonce='stable-'+Date.now();let h=await fetch('./index.html?force='+nonce,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('index '+r.status);return r.text()});h=h.replace(/game\.js\?v=[^"']+/g,'game.js?v='+nonce).replace(/audio_theme\.js\?v=[^"']+/g,'audio_theme.js?v='+nonce).replace(/style\.css\?v=[^"']+/g,'style.css?v='+nonce);document.open();document.write(h);document.close();}catch(e){document.body.innerHTML='<div style="padding:30px;font:700 18px system-ui;color:white;text-align:center">Puffling could not load.<br><small>Please refresh the page.</small></div>';console.error('Puffling stable loader',e)}})();</script></body></html>
