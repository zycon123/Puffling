databases:
  - name: puffling-game-db
    plan: free
    region: frankfurt

services:
  - type: web
    name: puffling-race-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: puffling-game-db
          property: connectionString
      - key: PUFFLING_IAP_PROVIDER_MODE
        value: disabled
