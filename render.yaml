services:
  - type: web
    name: puffling-race-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PUFFLING_AUTH_SECRET
        sync: false
      - key: PUFFLING_WALLET_SECRET
        sync: false
      - key: PUFFLING_IAP_PROVIDER_MODE
        value: disabled
